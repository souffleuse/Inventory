services:
  inventory:
    build: .
    container_name: inventory
    hostname: inventory
    ports:
      - "8080:80"
    volumes:
      # Persist JSON data outside the container
      - ./data:/app/data
    environment:
      - PORT=80
    restart: unless-stopped
    networks:
      - default
      - video-renamer-net
    deploy:
      resources:
        limits:
          memory: 256m
        reservations:
          memory: 64m

networks:
  default:
  video-renamer-net:
    external: true
    name: movie-file-name-cleaner_video-renamer-net
